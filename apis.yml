aid: known
name: Known
description: 'Known is a voice-first, swipeless dating application founded in 2025 by Celeste Amadon and
  Asher Allen and headquartered in San Francisco, California. Instead of profiles, feeds, queues, and
  swiping, Known onboards users through a voice-AI interview and then sends one curated introduction at
  a time, with a 24-hour acceptance window on both sides. When both people accept, Known helps pick a
  restaurant that fits both sets of preferences and checks calendar availability, then collects a short
  post-date check-in to refine future matches. The company optimizes for in-person dates rather than
  engagement, and has raised $9.7M from Forerunner Ventures, NFX, and other investors. The product is
  iOS-only in the United States today, with waitlists for Android and for Apple users outside the US.
  Known publishes no public developer program, API, or SDKs; it does publish a first-party llms.txt
  describing the product for AI agents.'
